[pytest]
pythonpath = .
testpaths = tests

# 关于覆盖率：门槛与统计范围都**只写在 CI 里**
# （.github/workflows/ci.yml 的 test job，`--cov=agents --cov=orchestrator …`）。
#
# 为什么不在这个文件里用 `[coverage:run] source` 配范围：pytest-cov 的**裸 `--cov`**
# 等价于 `--cov=.`，会覆盖 coverage 的 `source` 设置，于是 tests/、legacy/、tools/
# 全被算进来，覆盖率从 89% 掉到 74% —— 配置看着生效、实际没生效。
# 实测踩过这一次之后，宁可把范围显式写在 CI 命令里（一处、可读、不会静默失效）。
#
# 本地等价命令见 CI 里的注释；`pytest -q` 本身不要求安装 pytest-cov。
