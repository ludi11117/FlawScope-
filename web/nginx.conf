# FlawScope 前端 nginx 配置。
#
# 承担两件事：
#   1. 托管 SPA 静态资源（含 history 路由回退）
#   2. 把 /api 反代到后端容器，并**针对 SSE 关闭缓冲**

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限。nginx 默认只放行 1MB，而后端允许的 image_base64 上限是
    # 8,000,000 字符（config.py，约 6MB 原图、base64 后约 8MB），
    # 两者对不上时带图诊断会被代理直接 413 挡掉 —— 用户看到的是"上传失败"，
    # 而根因在 nginx，日志里才有。
    # 12m 比后端上限留了余量给 JSON 信封与多字节字符。
    client_max_body_size 12m;

    # 压缩静态产物。nginx 默认只压 text/html，而 Vite 产物主要是 js/css。
    #
    # ⚠️ **绝不能压 SSE**：`text/event-stream` 不在 gzip_types 里，
    # 且 `gzip_proxied off`（默认值，这里显式写出来）保证反代响应不被压缩。
    # 一旦把流压进 gzip 缓冲区，前端的"逐节点进度"会退化成"最后一次性全出来"，
    # 与 proxy_buffering off 的意图正好相反。
    gzip on;
    gzip_proxied off;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # 静态资源：带 hash 的文件名可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退：前端路由的路径在磁盘上并不存在文件，
    # 不做这个回退，用户直接访问 /history 会拿到 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代
    location /api/ {
        # 末尾的 / 会剥掉 /api 前缀：/api/records -> /records，
        # 与 Vite 开发期的 rewrite 行为保持一致，
        # 这样前端代码在开发和生产两种环境下请求路径完全一样。
        proxy_pass http://flawscope:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== SSE 关键配置 =====
        # 默认情况下 nginx 会缓冲上游响应，攒够一个 buffer 才下发。
        # 对 /diagnose/stream 这种"每个节点推一条"的接口，缓冲会让前端的
        # 逐节点进度退化成"最后一次性全出来"，SSE 等于白做。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 一次诊断要串行走 6~9 次 LLM 调用，实测可达数十秒；
        # 默认 60s 读超时会在中途掐断流式连接。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
